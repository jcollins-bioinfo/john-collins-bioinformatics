    <g stroke="#0a1717" stroke-opacity=".24" stroke-width="2">
      <path d="M88 0V148M176 0V148M264 0V148M352 0V148M440 0V148M528 0V148M616 0V148M704 0V148M792 0V148M880 0V148M968 0V148M1056 0V148M1144 0V148M1232 0V148M1320 0V148"/>
    </g>
    <g fill="#0a1717">
      <path d="M57 0h56v88H57zM145 0h56v88h-56zM321 0h56v88h-56zM409 0h56v88h-56zM497 0h56v88h-56zM673 0h56v88h-56zM761 0h56v88h-56zM937 0h56v88h-56zM1025 0h56v88h-56zM1113 0h56v88h-56zM1289 0h56v88h-56z"/>
    </g>
  </g>

  <text x="1498" y="858" text-anchor="end" fill="#f2f5ed" opacity=".56" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="3">JOHN PATRICK COLLINS</text>
