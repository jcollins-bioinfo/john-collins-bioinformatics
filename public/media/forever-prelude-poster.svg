<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Forever — Prelude in D-flat Major</title>
  <desc id="description">A dark green editorial poster with musical staff lines and an abstract piano keyboard.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17302e"/>
      <stop offset="0.56" stop-color="#0a1717"/>
      <stop offset="1" stop-color="#071111"/>
    </linearGradient>
    <radialGradient id="glow" cx="73%" cy="28%" r="58%">
      <stop offset="0" stop-color="#74a79e" stop-opacity=".24"/>
      <stop offset=".52" stop-color="#42736a" stop-opacity=".09"/>
      <stop offset="1" stop-color="#0a1717" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="12" r="1" fill="#f2f5ed" opacity=".045"/>
      <circle cx="53" cy="38" r=".8" fill="#f2f5ed" opacity=".035"/>
      <circle cx="29" cy="70" r=".6" fill="#f2f5ed" opacity=".03"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#field)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>

  <g fill="none" stroke="#f2f5ed" stroke-opacity=".11" stroke-width="2">
    <path d="M100 202H1500"/>
    <path d="M100 228H1500"/>
    <path d="M100 254H1500"/>
    <path d="M100 280H1500"/>
    <path d="M100 306H1500"/>
  </g>

  <g transform="translate(101 100)">
    <circle cx="6" cy="7" r="6" fill="#dce838"/>
    <text x="31" y="13" fill="#f2f5ed" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" letter-spacing="4">ORIGINAL PIANO MUSIC</text>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif" fill="#f2f5ed">
    <text x="98" y="466" font-size="154" letter-spacing="-7">Forever</text>
    <text x="106" y="527" font-family="Arial, Helvetica, sans-serif" font-size="25" letter-spacing="5" opacity=".72">OP. 1, NO. 15  ·  PRELUDE IN D-FLAT MAJOR</text>
  </g>

